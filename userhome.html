<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap");

      body {
        font-family: "Inter", sans-serif;
        background-image: url("5297078.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #eaeaea;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .navbar {
        background-color: rgba(0, 0, 0, 0.5); /* semi-transparent */
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 14px 24px; /* ⬅️ Increase vertical padding */
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        height: 70px; /* ⬅️ Optional: define height */
      }

      .navbar a {
        color: #f4a940;
        text-decoration: none;
        padding: 10px 16px;
        font-weight: 500;
        font-size: 16px;
        transition: background-color 0.3s, color 0.3s;
      }

      .navbar a:hover {
        color: white;
      }

      .dropdown,
      .user-dropdown {
        position: relative;
      }

      .dropdown-menu,
      .user-dropdown-menu {
        display: none;
        position: absolute;
        background-color: #1e1e1e;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        top: 100%;
        right: 0;
        min-width: 180px;
        z-index: 1000;
      }

      .dropdown:hover .dropdown-menu,
      .user-dropdown:hover .user-dropdown-menu {
        display: block;
      }

      .dropdown-menu a,
      .user-dropdown-menu a {
        color: #ddd;
        padding: 10px 16px;
        display: block;
        text-decoration: none;
      }

      .dropdown-menu a:hover,
      .user-dropdown-menu a:hover {
        background-color: #2a2a2a;
      }

      .disabled-link {
        pointer-events: none;
        opacity: 0.5;
        color: gray;
      }

      .container {
        max-width: 850px;
        margin: 40px auto;
        background-color: rgba(
          0,
          0,
          0,
          0.5
        ); /* ✅ semi-transparent background */
        /* backdrop-filter: blur(10px);          /* ✅ frosted glass effect */
        -webkit-backdrop-filter: blur(10px); /* ✅ Safari support */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        padding: 40px 30px;
      }

      h1,
      h3 {
        color: #f4a940;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7); /* improves contrast */
      }

      .user-info p {
        margin: 10px 0;
        font-size: 16px;
        color: #f1f1f1; /* brighter text */
      }

      .user-info strong {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <a href="/userhome" class="d-flex align-items-center">
        <img
          src="/LOGO.png"
          alt="Logo"
          style="height: 40px; margin-right: 10px"
        />
        <span style="color: #f4a940; font-weight: 600">Study Syndicate</span>
      </a>

      <div class="dropdown">
        <a href="#">🧪 Tests ▼</a>
        <div class="dropdown-menu">
          <a id="aptitudeLink" href="/aptitudetest">Aptitude Test</a>
          <a id="programmingLink" href="/programmingtest">Programming Test</a>
        </div>
      </div>

      <div class="user-dropdown">
        <a href="#">👤 User ▼</a>
        <div class="user-dropdown-menu">
          <a href="/editprofile">Edit Profile</a>
          <a href="/">Logout</a>
        </div>
      </div>
    </div>

    <div class="container text-center">
      <h1>Welcome, <span id="displayName">User</span>!</h1>
      <p class="mt-2 mb-4">
        Your dashboard has been updated with your details.
      </p>

      <div class="user-info text-start">
        <h3>Your Details</h3>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>Mobile:</strong> <span id="userMobile"></span></p>
        <p><strong>Username:</strong> <span id="userName"></span></p>
        <p>
          <strong>Aptitude Test Score:</strong>
          <span id="Aptitude Test Score">0</span>
        </p>
        <p>
          <strong>Programming Test Score:</strong>
          <span id="programming Test Score">0</span>
        </p>
      </div>
    </div>

    <script>
      async function fetchUserScores() {
        const response = await fetch("/get_user_scores");
        const data = await response.json();
        console.log("User Scores:", data);
        if (data.success) {
          document.getElementById("Aptitude Test Score").innerText =
            data.scores.Aptitude || 0;
          document.getElementById("programming Test Score").innerText =
            data.scores.Programming || 0;
        }
      }

      function getCookie(name) {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
          const [key, value] = cookie.trim().split("=");
          if (key === name) return decodeURIComponent(value);
        }
        return null;
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetchUserScores();

        let username = getCookie("username") || "User";
        let email = getCookie("email") || "Not Provided";
        let mobile = getCookie("mobile") || "Not Provided";

        document.getElementById("displayName").innerText = username;
        document.getElementById("userName").innerText = username;
        document.getElementById("userEmail").innerText = email;
        document.getElementById("userMobile").innerText = mobile;

    checkTestStatus("aptitude", "aptitudeLink");
    checkTestStatus("programming", "programmingLink");
  });

  async function checkTestStatus(testType, linkId) {
    try {
      const response = await fetch("/check_test_status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ test_type: testType }),
      });

      const data = await response.json();

      if (data.taken) {
        const link = document.getElementById(linkId);
        if (link) {
          link.classList.add("disabled-link");
          link.removeAttribute("href");
          link.style.pointerEvents = "none";
          link.style.opacity = "0.5";
          link.innerText += " (Attempted)";
        }
      }
    } catch (err) {
      console.error("❌ Test status check failed:", err);
    }
  }
</script>
  </body>
</html>
